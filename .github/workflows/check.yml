name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            remote/package-lock.json
      # Temporary diagnostic step for the existing dependency audit findings. Revert after lock refresh.
      - name: Calculate dependency lockfile update
        run: |
          npm install next@15.5.27 eslint-config-next@15.5.27 --save-exact --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || true
          echo "BEGIN_LOCK_DIFF"
          git diff --unified=0 -- package.json package-lock.json
          echo "END_LOCK_DIFF"
      - run: npm ci
      - run: npm ci --prefix remote
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --prefix remote --audit-level=moderate
